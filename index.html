<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a"><title>Заявки на ремонт</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"></head><body>
<div id="loading" class="screen hidden"><div class="loader"></div><div>Загрузка…</div></div>
<section id="main-screen"><header class="topbar"><div><div class="eyebrow">Внутреннее приложение</div><h1>Заявки на ремонт</h1></div><div class="open-badge">Открытый доступ</div></header><main class="container">
<div class="tabs"><button data-tab="active" class="tab active">Активные</button><button data-tab="new" class="tab">Новая заявка</button><button data-tab="stats" class="tab">Статистика</button></div>
<section id="tab-active" class="tab-panel"><div class="toolbar"><div class="summary"><b id="active-count">0</b><span>активных заявок</span></div><select id="status-filter"><option value="">Все статусы</option><option>Создана</option><option>В работе</option><option>Ожидаются запчасти</option></select><button id="show-active-btn" class="primary">Показать активные заявки</button></div><div id="requests" class="request-list"><div class="card muted">Нажмите «Показать активные заявки», чтобы загрузить актуальный список.</div></div></section>
<section id="tab-new" class="tab-panel hidden"><div class="card"><h2>Новая заявка</h2><form id="request-form" class="grid"><label>Госномер автомобиля<input id="vehicle" maxlength="20" placeholder="А123ВС77" required></label><label>Вид заявки<select id="type"><option>Диагностика</option><option>Ремонт</option><option>Шиномонтаж</option><option>ТО</option></select></label><label>Статус<select id="new-status" disabled><option>Создана</option></select></label><label>Какая автоколонна?<select id="fleet" required><option value="">Выберите автоколонну</option><option>Автоколонна №1</option><option>Автоколонна №2</option><option>Участок механизации</option></select></label><label class="full">Комментарий<textarea id="comment" rows="4" maxlength="500" placeholder="Кратко опишите неисправность"></textarea></label><button class="primary full" type="submit">Создать заявку</button><div id="create-message" class="success full hidden"></div></form></div></section>
<section id="tab-stats" class="tab-panel hidden"><div class="card"><h2>Статистика</h2><div class="grid"><label>С<input id="date-from" type="date"></label><label>По<input id="date-to" type="date"></label><button id="load-stats" class="primary full">Показать</button><button id="download-csv" class="secondary full">Скачать Excel CSV</button></div></div><div id="stats-content" class="stats-content"></div></section>
</main></section>
<template id="request-template"><article class="request card"><div class="request-head"><div><span class="vehicle-tag"></span><span class="type-tag"></span><span class="fleet-tag"></span></div><span class="status-badge"></span></div><p class="comment"></p><div class="meta"></div><div class="manager-actions"><select class="status-select"><option>Создана</option><option>В работе</option><option>Ожидаются запчасти</option><option>Выполнена</option></select></div></article></template>
<script type="module" src="app.js?v=14"></script></body></html>
